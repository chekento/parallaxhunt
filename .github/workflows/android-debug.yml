name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallaxhunt-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Godot 4.7.2 and native Android sources
        run: |
          GODOT_TOOLS="$RUNNER_TEMP/parallax-godot"
          GODOT_TEMPLATES="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$GODOT_TOOLS" "$GODOT_TEMPLATES"
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$GODOT_TOOLS/godot.zip"
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o "$GODOT_TOOLS/templates.tpz"
          unzip -q "$GODOT_TOOLS/godot.zip" -d "$GODOT_TOOLS"
          unzip -q -j "$GODOT_TOOLS/templates.tpz" 'templates/android*' 'templates/version.txt' -d "$GODOT_TEMPLATES"
          echo "GODOT_BIN=$GODOT_TOOLS/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          python3 scripts/prepare_android.py --template "$GODOT_TEMPLATES/android_source.zip"
          chmod +x android/build/gradlew

      - name: Import project and configure export
        run: |
          "$GODOT_BIN" --headless --editor --path . --import --quit > import.log 2>&1
          cat import.log
          if grep -E 'SCRIPT ERROR|Parse Error' import.log; then exit 1; fi
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path=Path.home()/'.config/godot/editor_settings-4.7.tres'
          text=path.read_text()
          for key,value in [('java_sdk_path',os.environ['JAVA_HOME']),('android_sdk_path',os.environ['ANDROID_HOME'])]:
              text=re.sub(r'^export/android/'+key+r' = .*\n?', '', text, flags=re.M)
              text+='\nexport/android/'+key+' = '+json.dumps(value)+'\n'
          path.write_text(text)
          PY

      - name: Restore optional persistent test signing key
        env:
          PARALLAX_DEBUG_KEYSTORE_BASE64: ${{ secrets.PARALLAX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PARALLAX_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/parallax-signing"
            printf '%s' "$PARALLAX_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parallax-signing/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/parallax-signing/debug.keystore" >> "$GITHUB_ENV"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
          fi

      - name: Runtime smoke test
        run: |
          "$GODOT_BIN" --headless --path . --quit-after 8 > runtime.log 2>&1
          cat runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid access|Invalid call|Attempt to call|Cannot get class' runtime.log; then exit 1; fi

      - name: City, controls, tracking, rewards and save test
        run: |
          timeout 35 "$GODOT_BIN" --headless --path . -- --city-smoke > city-smoke.log 2>&1
          cat city-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' city-smoke.log; then exit 1; fi
          grep -q 'CITY_SMOKE_OK' city-smoke.log

      - name: Character, objectives, circuits and session test
        run: |
          timeout 45 "$GODOT_BIN" --headless --path . -- --experience-smoke > experience-smoke.log 2>&1
          cat experience-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' experience-smoke.log; then exit 1; fi
          grep -q 'EXPERIENCE_SMOKE_OK' experience-smoke.log

      - name: Menu input, room access, canal objectives and driving regression
        run: |
          timeout 45 "$GODOT_BIN" --headless --path . -- --quality-smoke > quality-smoke.log 2>&1
          cat quality-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' quality-smoke.log; then exit 1; fi
          grep -q 'QUALITY_SMOKE_OK' quality-smoke.log

      - name: Regional routes, outings, bus, atlas touch input and save regression
        run: |
          timeout 90 "$GODOT_BIN" --headless --path . -- --region-smoke > region-smoke.log 2>&1
          cat region-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' region-smoke.log; then exit 1; fi
          grep -q 'REGION_SMOKE_OK' region-smoke.log

      - name: Neighborhood stories, real puzzles, menu touch and journal regression
        run: |
          timeout 100 "$GODOT_BIN" --headless --path . -- --life-smoke > life-smoke.log 2>&1
          cat life-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' life-smoke.log; then exit 1; fi
          grep -q 'LIFE_SMOKE_OK' life-smoke.log

      - name: Full campaign, proximity quests, evidence, choices and save regression
        run: |
          timeout 180 "$GODOT_BIN" --headless --path . -- --story-smoke > story-smoke.log 2>&1
          cat story-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' story-smoke.log; then exit 1; fi
          grep -q 'STORY_SMOKE_OK' story-smoke.log

      - name: 3D Photo Hunt smoke test
        run: |
          photo_exit=0
          timeout 60 "$GODOT_BIN" --headless --path . -- --photo-smoke > photo-smoke.log 2>&1 || photo_exit=$?
          cat photo-smoke.log
          if [ "$photo_exit" -ne 0 ]; then exit "$photo_exit"; fi
          if grep -E 'SCRIPT ERROR|Parse Error|PHOTO_SMOKE: ' photo-smoke.log; then exit 1; fi
          grep -q 'PHOTO_SMOKE_OK' photo-smoke.log

      - name: Export Android preview APK
        run: |
          mkdir -p build
          touch build/.gdignore
          "$GODOT_BIN" --headless --path . --export-debug 'Android Preview' build/ParallaxHunt-1.26.0-preview.apk
          test -s build/ParallaxHunt-1.26.0-preview.apk
          sha256sum build/ParallaxHunt-1.26.0-preview.apk > build/ParallaxHunt-1.26.0-preview.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxHunt-1.26.0-Android-Preview
          path: |
            build/ParallaxHunt-1.26.0-preview.apk
            build/ParallaxHunt-1.26.0-preview.apk.sha256
          if-no-files-found: error
          retention-days: 30
