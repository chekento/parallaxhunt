name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallaxhunt-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: ./build
          archive_output: false
          export_debug: true

      - name: Runtime smoke test
        run: |
          GODOT_BIN="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 2 -type f -name 'Godot_v*-stable_linux.x86_64' | head -1)"
          echo "Godot runtime: $GODOT_BIN"
          test -x "$GODOT_BIN"
          set +e
          "$GODOT_BIN" --headless --path . --quit-after 8 > runtime.log 2>&1
          STATUS=$?
          set -e
          cat runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid call|Attempt to call|not declared in the current scope|Cannot get class" runtime.log; then
            echo "Runtime smoke test detected a Godot script/runtime error."
            exit 1
          fi
          test "$STATUS" -eq 0

      - name: Locate APK
        run: |
          find build -type f -maxdepth 4 -print
          test -n "$(find build -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxHunt-Android-debug
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 30
